<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사내 공지사항 게시판</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h1 class="h3 mb-1">공지사항</h1>
          <p class="text-body-secondary mb-0">공지 목록을 조회하고, 공지를 등록/수정/삭제할 수 있습니다.</p>
        </div>
        <div class="d-flex gap-2">
          <button id="delete-selected-btn" type="button" class="btn btn-outline-danger">선택 삭제</button>
          <button id="open-create-btn" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#notice-modal">
            공지 작성
          </button>
        </div>
      </div>

      <form id="search-form" class="row g-2 align-items-end mb-3" aria-label="공지사항 검색">
        <div class="col-12 col-md-3">
          <label for="search-category" class="form-label">말머리</label>
          <select id="search-category" class="form-select">
            <option value="all">전체</option>
            <option value="notice">공지</option>
            <option value="general">일반</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label for="search-field" class="form-label">검색조건</label>
          <select id="search-field" class="form-select">
            <option value="author">작성자명</option>
            <option value="title-content">제목+내용</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label for="search-keyword" class="form-label">검색어</label>
          <input id="search-keyword" type="text" class="form-control" placeholder="검색어를 입력하세요" />
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button type="submit" class="btn btn-primary">검색</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-bordered table-hover table-striped align-middle mb-0" aria-label="공지사항 목록">
          <thead class="table-secondary text-center">
            <tr>
              <th scope="col" style="width: 7rem">번호</th>
              <th scope="col" style="width: 3rem">
                <input id="check-all" class="form-check-input" type="checkbox" aria-label="전체 선택" />
              </th>
              <th scope="col">제목</th>
              <th scope="col" style="width: 12rem">작성자</th>
              <th scope="col" style="width: 12rem">작성일자</th>
              <th scope="col" style="width: 7rem">조회수</th>
              <th scope="col" style="width: 10rem">관리</th>
            </tr>
          </thead>
          <tbody id="notice-table-body"></tbody>
        </table>
      </div>

      <p id="empty-state" class="text-center text-body-secondary py-4 d-none">조건에 맞는 공지사항이 없습니다.</p>

      <nav id="pagination-nav" class="mt-3" aria-label="공지사항 페이지 이동">
        <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
      </nav>
    </main>

    <template id="notice-row-template">
      <tr>
        <td class="text-center fw-semibold notice-number"></td>
        <td class="text-center">
          <input class="form-check-input row-check" type="checkbox" aria-label="공지 선택" />
        </td>
        <td>
          <span class="badge text-bg-danger me-2 notice-badge d-none">NOTICE</span>
          <button type="button" class="btn btn-link p-0 text-start text-decoration-none notice-title"></button>
        </td>
        <td class="text-center notice-author"></td>
        <td class="text-center notice-date"></td>
        <td class="text-center notice-views"></td>
        <td class="text-center">
          <div class="btn-group btn-group-sm" role="group" aria-label="공지 관리">
            <button type="button" class="btn btn-outline-primary edit-btn">수정</button>
            <button type="button" class="btn btn-outline-danger delete-btn">삭제</button>
          </div>
        </td>
      </tr>
    </template>

    <div class="modal fade" id="notice-modal" tabindex="-1" aria-labelledby="notice-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="notice-form" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="notice-modal-label">공지 작성</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="notice-id" />
            <div class="mb-3">
              <label class="form-label" for="title">제목</label>
              <input class="form-control" id="title" type="text" maxlength="120" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="author">작성자</label>
              <input class="form-control" id="author" type="text" maxlength="40" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="content">내용</label>
              <textarea class="form-control" id="content" rows="6" maxlength="2000" required></textarea>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="is-notice" />
              <label class="form-check-label" for="is-notice">상단 고정 공지(NOTICE)로 등록</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
            <button id="save-btn" type="submit" class="btn btn-primary">등록</button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="script.js" defer></script>
  </body>
</html>
